<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social AI Strategist</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      color: #2d2d2d;
    }
    h1 {
      color: #2d3436;
      font-size: 26px;
      margin-bottom: 4px;
    }
    h2 {
      color: #2d3436;
      margin-top: 40px;
      font-size: 17px;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 8px;
      display: inline-block;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid #d5dae0;
      box-sizing: border-box;
      margin-top: 6px;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #4CAF50;
    }
    textarea { height: 80px; }
    .tone-label {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      color: #555;
      font-weight: 600;
    }
    button {
      margin-top: 12px;
      padding: 11px 22px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #43a047; transform: translateY(-1px); }
    button.secondary { background: #78828c; }
    button.secondary:hover { background: #636d76; }
    #result {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      border: 1px solid #e0e4e8;
      white-space: pre-wrap;
      min-height: 40px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    #loading { color: #888; font-style: italic; }
    .post-card {
      background: white;
      border: 1px solid #e0e4e8;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .post-card .business {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      text-transform: capitalize;
    }
    .post-card .caption { white-space: pre-wrap; line-height: 1.5; }

    #authBox {
      background: white;
      padding: 28px;
      border-radius: 14px;
      border: 1px solid #e0e4e8;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    #appBox { display: none; }
    #userBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
      color: #555;
    }
    .error-msg {
      color: #c0392b;
      font-size: 13px;
      margin-top: 8px;
    }
    .toggle-link {
      font-size: 13px;
      color: #4CAF50;
      cursor: pointer;
      margin-top: 12px;
      display: inline-block;
      font-weight: 600;
    }
    .small-btn {
      font-size: 12px;
      padding: 7px 14px;
      margin-top: 10px;
    }
    .comment-box { margin-top: 10px; }
    .comment-box textarea { height: 60px; }
    .sentiment-result {
      margin-top: 12px;
      padding: 12px;
      background: #f0f8f0;
      border-radius: 10px;
      font-size: 13px;
      border-left: 3px solid #4CAF50;
    }
    .suggestion { color: #555; }
    .schedule-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    .schedule-row input { margin-top: 0; flex: 1; }
    .calendar-card { border-left: 4px solid #4CAF50; }
    .scheduled-date {
      font-weight: bold;
      color: #4CAF50;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat-box {
      background: white;
      border: 1px solid #e0e4e8;
      border-radius: 12px;
      padding: 16px 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .stat-number {
      font-size: 26px;
      font-weight: 700;
      color: #4CAF50;
    }
    .stat-label {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .sentiment-summary {
      background: white;
      border: 1px solid #e0e4e8;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
  </style>
</head>
<body>

  <h1>📱 Social AI Strategist</h1>

  <!-- AUTH BOX (shown when logged out) -->
  <div id="authBox">
    <h2 id="authTitle">Log In</h2>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPassword" placeholder="Password">
    <button onclick="handleAuth()" id="authButton">Log In</button>
    <div class="error-msg" id="authError"></div>
    <div class="toggle-link" onclick="toggleAuthMode()" id="authToggle">Don't have an account? Sign up</div>
  </div>

  <!-- APP BOX (shown when logged in) -->
  <div id="appBox">
    <div id="userBar">
      <span id="userEmail"></span>
      <button class="secondary" onclick="logOut()">Log Out</button>
    </div>

    <p>Describe your business and get an AI-generated Instagram caption:</p>
    <textarea id="businessInput" placeholder="e.g. A small home bakery in Lahore that sells custom birthday cakes"></textarea>

    <label class="tone-label">Brand Voice:</label>
    <select id="toneSelect">
      <option value="friendly">Friendly & Warm</option>
      <option value="professional">Professional</option>
      <option value="fun and playful">Fun & Playful</option>
      <option value="luxurious and elegant">Luxurious & Elegant</option>
      <option value="bold and confident">Bold & Confident</option>
    </select>
    <br>
    <button onclick="generateCaption()">Generate Caption</button>

    <div id="result"></div>

    <h2>📊 Analytics Dashboard</h2>
    <div id="analytics">Loading analytics...</div>

    <h2>📅 Content Calendar</h2>
    <div id="calendar">Loading scheduled posts...</div>

    <h2>📜 History</h2>
    <div id="history">Loading past posts...</div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD34XJdWLFD9djMMTY-UAXqGVNrNt3wWoE",
      authDomain: "social-ai-strategist.firebaseapp.com",
      projectId: "social-ai-strategist",
      storageBucket: "social-ai-strategist.firebasestorage.app",
      messagingSenderId: "392812797778",
      appId: "1:392812797778:web:e8a3e32518aba403a7a48b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isSignupMode = false;
    let currentUser = null;

    window.toggleAuthMode = function () {
      isSignupMode = !isSignupMode;
      document.getElementById('authTitle').innerText = isSignupMode ? 'Sign Up' : 'Log In';
      document.getElementById('authButton').innerText = isSignupMode ? 'Sign Up' : 'Log In';
      document.getElementById('authToggle').innerText = isSignupMode
        ? 'Already have an account? Log in'
        : "Don't have an account? Sign up";
      document.getElementById('authError').innerText = '';
    };

    window.handleAuth = async function () {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const errorDiv = document.getElementById('authError');
      errorDiv.innerText = '';

      if (!email || !password) {
        errorDiv.innerText = 'Please enter both email and password.';
        return;
      }

      try {
        if (isSignupMode) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        errorDiv.innerText = error.message;
      }
    };

    window.logOut = function () {
      signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('appBox').style.display = 'block';
        document.getElementById('userEmail').innerText = user.email;
        window.loadHistory();
        window.loadAnalytics();
      } else {
        document.getElementById('authBox').style.display = 'block';
        document.getElementById('appBox').style.display = 'none';
      }
    });

    window.getCurrentUser = function () {
      return currentUser;
    };
  </script>

  <script>
    async function generateCaption() {
      const user = getCurrentUser();
      if (!user) return;

      const input = document.getElementById('businessInput').value;
      const tone = document.getElementById('toneSelect').value;
      const resultDiv = document.getElementById('result');

      if (!input.trim()) {
        resultDiv.innerText = 'Please describe your business first.';
        return;
      }

      resultDiv.innerHTML = '<span id="loading">Generating caption...</span>';

      try {
        const idToken = await user.getIdToken();
        const response = await fetch('http://localhost:3000/generate-caption', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${idToken}`
          },
          body: JSON.stringify({ businessDescription: input, tone: tone })
        });

        const data = await response.json();

        if (data.caption) {
          resultDiv.innerText = data.caption;
          loadHistory();
          loadAnalytics();
        } else {
          resultDiv.innerText = 'Error: ' + (data.error || 'Something went wrong.');
        }
      } catch (error) {
        resultDiv.innerText = 'Error connecting to server. Is your backend running?';
      }
    }

    let allPosts = [];

    async function loadHistory() {
      const user = getCurrentUser();
      if (!user) return;

      const historyDiv = document.getElementById('history');
      try {
        const idToken = await user.getIdToken();
        const response = await fetch('http://localhost:3000/posts', {
          headers: { 'Authorization': `Bearer ${idToken}` }
        });
        const data = await response.json();

        allPosts = data.posts || [];

        renderCalendar();
        renderHistory();
      } catch (error) {
        historyDiv.innerHTML = '<p>Could not load history. Is your backend running?</p>';
      }
    }

    function renderHistory() {
      const historyDiv = document.getElementById('history');

      if (allPosts.length === 0) {
        historyDiv.innerHTML = '<p>No posts yet — generate your first caption above!</p>';
        return;
      }

      historyDiv.innerHTML = allPosts.map(post => renderPostCard(post)).join('');
    }

    function renderCalendar() {
      const calendarDiv = document.getElementById('calendar');
      const scheduledPosts = allPosts
        .filter(p => p.scheduledDate)
        .sort((a, b) => new Date(a.scheduledDate) - new Date(b.scheduledDate));

      if (scheduledPosts.length === 0) {
        calendarDiv.innerHTML = '<p>No posts scheduled yet. Schedule a post from your History below.</p>';
        return;
      }

      calendarDiv.innerHTML = scheduledPosts.map(post => `
        <div class="post-card calendar-card">
          <div class="scheduled-date">🗓️ ${new Date(post.scheduledDate).toLocaleString()}</div>
          <div class="business">${post.businessDescription}</div>
          <div class="caption">${post.caption}</div>
        </div>
      `).join('');
    }

    function renderPostCard(post) {
      return `
        <div class="post-card">
          <div class="business">${post.businessDescription}</div>
          <div class="caption">${post.caption}</div>

          <div class="schedule-row">
            <input type="datetime-local" id="scheduleInput-${post.id}" value="${post.scheduledDate ? toDatetimeLocal(post.scheduledDate) : ''}">
            <button class="secondary small-btn" onclick="schedulePost('${post.id}')">
              ${post.scheduledDate ? 'Update Schedule' : 'Schedule Post'}
            </button>
          </div>

          ${post.sentiment ? `
            <div class="sentiment-result">
              <strong>Sentiment:</strong> 👍 ${post.sentiment.positive} · 😐 ${post.sentiment.neutral} · 👎 ${post.sentiment.negative}<br>
              <em>${post.sentiment.summary}</em><br>
              <span class="suggestion">💡 ${post.sentiment.suggestion}</span>
            </div>
          ` : `
            <button class="secondary small-btn" onclick="toggleCommentBox('${post.id}')">Analyze Sentiment</button>
            <div class="comment-box" id="commentBox-${post.id}" style="display:none;">
              <textarea id="commentInput-${post.id}" placeholder="Paste sample comments here, one per line"></textarea>
              <button onclick="analyzeSentiment('${post.id}')">Run Analysis</button>
              <div id="sentimentStatus-${post.id}"></div>
            </div>
          `}
        </div>
      `;
    }

    function toDatetimeLocal(isoString) {
      const d = new Date(isoString);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function schedulePost(postId) {
      const user = getCurrentUser();
      if (!user) return;

      const input = document.getElementById(`scheduleInput-${postId}`);
      if (!input.value) {
        alert('Please pick a date and time first.');
        return;
      }

      const scheduledDate = new Date(input.value).toISOString();

      try {
        const idToken = await user.getIdToken();
        await fetch(`http://localhost:3000/posts/${postId}/schedule`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${idToken}`
          },
          body: JSON.stringify({ scheduledDate })
        });

        loadHistory();
      } catch (error) {
        alert('Error scheduling post.');
      }
    }

    function toggleCommentBox(postId) {
      const box = document.getElementById(`commentBox-${postId}`);
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    async function analyzeSentiment(postId) {
      const user = getCurrentUser();
      if (!user) return;

      const textarea = document.getElementById(`commentInput-${postId}`);
      const statusDiv = document.getElementById(`sentimentStatus-${postId}`);
      const rawComments = textarea.value.trim();

      if (!rawComments) {
        statusDiv.innerText = 'Please paste at least one comment.';
        return;
      }

      const comments = rawComments.split('\n').map(c => c.trim()).filter(c => c.length > 0);

      statusDiv.innerText = 'Analyzing...';

      try {
        const idToken = await user.getIdToken();
        const response = await fetch('http://localhost:3000/analyze-sentiment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${idToken}`
          },
          body: JSON.stringify({ postId, comments })
        });

        const data = await response.json();

        if (data.sentiment) {
          loadHistory(); // refresh to show the result
        } else {
          statusDiv.innerText = 'Error: ' + (data.error || 'Something went wrong.');
        }
      } catch (error) {
        statusDiv.innerText = 'Error connecting to server.';
      }
    }

    async function loadAnalytics() {
      const user = getCurrentUser();
      if (!user) return;

      const analyticsDiv = document.getElementById('analytics');
      try {
        const idToken = await user.getIdToken();
        const response = await fetch('http://localhost:3000/analytics', {
          headers: { 'Authorization': `Bearer ${idToken}` }
        });
        const data = await response.json();

        analyticsDiv.innerHTML = `
          <div class="analytics-grid">
            <div class="stat-box">
              <div class="stat-number">${data.totalPosts}</div>
              <div class="stat-label">Total Posts</div>
            </div>
            <div class="stat-box">
              <div class="stat-number">${data.totalPublished}</div>
              <div class="stat-label">Published</div>
            </div>
            <div class="stat-box">
              <div class="stat-number">${data.totalScheduled}</div>
              <div class="stat-label">Scheduled</div>
            </div>
            <div class="stat-box">
              <div class="stat-number">${data.analyzedCount}</div>
              <div class="stat-label">Analyzed</div>
            </div>
          </div>
          <div class="sentiment-summary">
            <strong>Overall Sentiment:</strong><br>
            👍 ${data.sentimentTotals.positive} Positive · 😐 ${data.sentimentTotals.neutral} Neutral · 👎 ${data.sentimentTotals.negative} Negative
          </div>
        `;
      } catch (error) {
        analyticsDiv.innerHTML = '<p>Could not load analytics.</p>';
      }
    }

    window.loadHistory = loadHistory;
    window.loadAnalytics = loadAnalytics;
  </script>

</body>
</html>
